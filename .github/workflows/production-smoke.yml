name: Verificar tienda en producción

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"
  workflow_run:
    workflows: ["Publicar tema en WordPress"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"

permissions:
  contents: read

concurrency:
  group: gravedad-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Versiones, seguridad y páginas comerciales
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar WordPress y WooCommerce
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            https://gravedad.com.ar/wp-json/ -o /tmp/wp-json.json
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            https://gravedad.com.ar/tienda/ -o /tmp/shop.html

          python3 - <<'PY'
          import json, re
          data = json.load(open('/tmp/wp-json.json', encoding='utf-8'))
          print('WordPress:', data.get('generator', 'versión no expuesta'))
          html = open('/tmp/shop.html', encoding='utf-8', errors='ignore').read()
          versions = sorted(set(re.findall(r'(?:woocommerce|wc-[^?"\']+)[^?"\']*\?ver=([0-9.]+)', html, re.I)))
          print('WooCommerce detectado en activos:', ', '.join(versions) if versions else 'versión no expuesta')
          assert 'wc/store' in json.dumps(data.get('routes', {})), 'La Store API de WooCommerce no está disponible'
          PY

      - name: Comprobar páginas de compra
        shell: bash
        run: |
          set -euo pipefail
          for path in / /tienda/ /carrito/ /finalizar-compra/ /mi-cuenta/; do
            result="$(curl --silent --show-error --location --retry 2 --retry-all-errors \
              --connect-timeout 15 --max-time 60 -o /dev/null \
              --write-out '%{http_code} %{time_starttransfer} %{url_effective}' \
              "https://gravedad.com.ar${path}")"
            echo "${path} ${result}"
            code="${result%% *}"
            test "$code" -ge 200 -a "$code" -lt 400
          done

      - name: Probar carrito y checkout con una sesión temporal
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            'https://gravedad.com.ar/wp-json/wc/store/v1/products?per_page=20&stock_status=instock' \
            -o /tmp/products.json

          product_id="$(python3 - <<'PY'
          import json
          products = json.load(open('/tmp/products.json', encoding='utf-8'))
          eligible = [
              p for p in products
              if p.get('is_purchasable') and p.get('is_in_stock') and p.get('type') == 'simple'
          ]
          if not eligible:
              raise SystemExit('No hay un producto simple, comprable y con stock para la prueba')
          print(eligible[0]['id'])
          PY
          )"
          echo "Producto temporal: ${product_id}"

          curl --fail --silent --show-error --location --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            --cookie-jar /tmp/cart.cookies --cookie /tmp/cart.cookies \
            "https://gravedad.com.ar/?add-to-cart=${product_id}" -o /dev/null

          cart_result="$(curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 60 \
            --cookie-jar /tmp/cart.cookies --cookie /tmp/cart.cookies \
            --output /tmp/cart.html --write-out '%{http_code} %{url_effective}' \
            https://gravedad.com.ar/carrito/)"
          checkout_result="$(curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 60 \
            --cookie-jar /tmp/cart.cookies --cookie /tmp/cart.cookies \
            --output /tmp/checkout.html --write-out '%{http_code} %{url_effective}' \
            https://gravedad.com.ar/finalizar-compra/)"
          echo "Carrito: ${cart_result}"
          echo "Checkout: ${checkout_result}"

          grep -Eiq 'woocommerce-cart-form|wc-block-cart' /tmp/cart.html
          grep -Eiq "woocommerce-checkout|wc-block-checkout|name=['\"]checkout['\"]" /tmp/checkout.html
          case "${checkout_result}" in
            2*\ https://gravedad.com.ar/finalizar-compra/*) ;;
            *) echo 'El checkout no quedó accesible con un producto en el carrito' >&2; exit 1 ;;
          esac

          if grep -Eiq 'wc-block-checkout' /tmp/checkout.html; then
            echo 'Tipo de checkout: bloques'
          else
            echo 'Tipo de checkout: clásico'
          fi

      - name: Comprobar HTTPS y cabeceras de seguridad
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 60 --dump-header /tmp/headers.txt \
            --output /dev/null https://gravedad.com.ar/
          tr -d '\r' </tmp/headers.txt | tee /tmp/headers-clean.txt
          grep -Eiq '^strict-transport-security:' /tmp/headers-clean.txt
          grep -Eiq '^content-security-policy:' /tmp/headers-clean.txt
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' /tmp/headers-clean.txt
          grep -Eiq '^x-frame-options:[[:space:]]*SAMEORIGIN' /tmp/headers-clean.txt

