name: Diagnosticar WordPress por SSH

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ssh-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    name: Verificar servidor sin realizar cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
    steps:
      - name: Preparar clave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/gravedad
          chmod 600 ~/.ssh/gravedad
          cat > /tmp/ssh-askpass <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF
          chmod 700 /tmp/ssh-askpass
          export SSH_ASKPASS=/tmp/ssh-askpass
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0
          eval "$(ssh-agent -s)"
          setsid -w ssh-add ~/.ssh/gravedad </dev/null
          resolved_port=""
          for candidate in "$SSH_PORT" 9022 22; do
            if timeout 10 ssh-keyscan -p "$candidate" -H "$SSH_HOST" > /tmp/host-key 2>/dev/null && test -s /tmp/host-key; then
              resolved_port="$candidate"
              break
            fi
          done
          if [ -z "$resolved_port" ]; then
            echo "El servidor no respondió en los puertos SSH configurados" >&2
            exit 4
          fi
          cat /tmp/host-key >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "SSH_RESOLVED_PORT=$resolved_port" >> "$GITHUB_ENV"
          echo "Puerto SSH detectado correctamente"

      - name: Consultar versiones y configuración
        shell: bash
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          cat > /tmp/ssh-askpass <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF
          chmod 700 /tmp/ssh-askpass
          export SSH_ASKPASS=/tmp/ssh-askpass
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0
          setsid -w ssh-add ~/.ssh/gravedad </dev/null
          printf '%s' '' | base64 --decode > /tmp/remote-diagnostic.sh
          ssh -p "$SSH_RESOLVED_PORT" -o BatchMode=yes -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" 'bash -s' < /tmp/remote-diagnostic.sh
