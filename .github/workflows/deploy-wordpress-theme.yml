name: Publicar tema en WordPress

on:
  push:
    branches: [main]
    paths:
      - "wordpress-theme/**"
      - "plugins/**"
      - ".cpanel.yml"
      - ".github/workflows/deploy-wordpress-theme.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gravedad-wordpress-theme
  cancel-in-progress: true

jobs:
  validate:
    name: Validar tema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validar sintaxis PHP
        run: find wordpress-theme plugins -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validar JavaScript
        run: find wordpress-theme/assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verificar versión y archivos obligatorios
        shell: bash
        run: |
          set -euo pipefail
          test -f wordpress-theme/style.css
          test -f wordpress-theme/functions.php
          STYLE_VERSION="$(sed -n 's/^Version:[[:space:]]*//p' wordpress-theme/style.css | head -1)"
          CODE_VERSION="$(sed -n "s/.*GRAVEDAD_VERSION', '\([^']*\)'.*/\1/p" wordpress-theme/functions.php | head -1)"
          test -n "$STYLE_VERSION"
          test "$STYLE_VERSION" = "$CODE_VERSION"

  deploy:
    name: Actualizar y desplegar desde cPanel
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://gravedad.com.ar/
    steps:
      - name: Comprobar configuración
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: test -n "$CPANEL_TOKEN"

      - name: Actualizar repositorio en cPanel
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --connect-timeout 20 --max-time 90 \
            --header "Authorization: cpanel vagrvmja:${CPANEL_TOKEN}" \
            --get "https://mon22.servidoraweb.net:2083/execute/VersionControl/update" \
            --data-urlencode "repository_root=/home6/vagrvmja/repositories/gravedad-store" \
            --data-urlencode "branch=main" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); x=r.get("result") or r.get("cpanelresult") or r; s=x.get("status"); print("cPanel:", x.get("errors") or x.get("error") or x.get("messages") or "respuesta sin estado"); assert s == 1, "cPanel no confirmó la actualización"'

      - name: Desplegar tema en WordPress
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --connect-timeout 20 --max-time 90 \
            --header "Authorization: cpanel vagrvmja:${CPANEL_TOKEN}" \
            --get "https://mon22.servidoraweb.net:2083/execute/VersionControlDeployment/create" \
            --data-urlencode "repository_root=/home6/vagrvmja/repositories/gravedad-store" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); x=r.get("result") or r.get("cpanelresult") or r; s=x.get("status"); print("cPanel:", x.get("errors") or x.get("error") or x.get("messages") or "respuesta sin estado"); assert s == 1, "cPanel no confirmó el despliegue"'
