name: Publicar tema en WordPress

on:
  push:
    branches: [main]
    paths:
      - "wordpress-theme/**"
  workflow_dispatch:

concurrency:
  group: gravedad-wordpress-theme
  cancel-in-progress: true

jobs:
  deploy:
    name: Actualizar y desplegar desde cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar repositorio en cPanel
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 \
            --header "Authorization: cpanel oaggssaw:${CPANEL_TOKEN}" \
            --get "https://mon23.servidoraweb.net:2083/execute/VersionControl/update" \
            --data-urlencode "repository_root=/home5/oaggssaw/repositories/gravedad-store" \
            --data-urlencode "branch=main" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["result"]["status"] == 1, r'

      - name: Desplegar tema en WordPress
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 \
            --header "Authorization: cpanel oaggssaw:${CPANEL_TOKEN}" \
            --get "https://mon23.servidoraweb.net:2083/execute/VersionControlDeployment/create" \
            --data-urlencode "repository_root=/home5/oaggssaw/repositories/gravedad-store" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["result"]["status"] == 1, r'
