name: Publicar tema en WordPress

on:
  push:
    branches: [main]
    paths:
      - "wordpress-theme/**"
      - ".github/workflows/deploy-wordpress-theme.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: gravedad-wordpress-theme
  cancel-in-progress: true

jobs:
  deploy:
    name: Sincronizar tema por FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Instalar cliente FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp

      - name: Publicar en WordPress
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          set -euo pipefail
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:timeout 60
          set net:max-retries 2
          set ftp:passive-mode true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 -u "$FTP_USERNAME","$FTP_PASSWORD" mon23.servidoraweb.net
          mirror --reverse --delete --verbose --exclude-glob .git* ./wordpress-theme/ "$FTP_PATH"
          bye
          LFTP
